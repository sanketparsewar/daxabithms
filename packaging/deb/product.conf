SHORTDESC='DaxabitHMS local restaurant and hotel management desktop application'
LONGDESC=' DaxabitHMS is a local restaurant and hotel management desktop application with POS, tables,
 kitchen display, reservations, QR ordering and inventory. This package installs a systemd
 service that runs version-pinned DaxabitHMS containers and a PostgreSQL database with Docker
 Compose, keeping all data in Docker volumes on this machine. Launch DaxabitHMS from the
 Applications menu; the local service listens on this computer only.
 .
 Settings are in /etc/daxabithms/daxabithms.env. Upgrade with apt;
 back up your data first.'
