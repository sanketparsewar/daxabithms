LONGDESC=' DaxabitHMS is a self-hosted restaurant and hotel management system with POS, tables,
 kitchen display, reservations, QR ordering and inventory. This package installs a systemd
 service that runs the published, version-pinned DaxabitHMS containers and a
 PostgreSQL database with Docker Compose, keeping all data in Docker volumes on
 this machine. Open http://localhost:1995 after installing.
 .
 Settings are in /etc/daxabithms/daxabithms.env. Upgrade with apt;
 back up your data first.'
