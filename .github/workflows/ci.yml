name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality-and-tests:
    name: Lint, Typecheck, Security, Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

      - name: Run TypeScript checks
        run: pnpm run typecheck

      - name: Run dependency security audit
        run: pnpm audit --audit-level=high

      - name: Run backend & frontend unit and integration tests
        run: pnpm run test

      - name: Run production build (Frontend & Backend)
        run: pnpm run build

  docker-build-verification:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [code-quality-and-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image (dry-run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          tags: daxabithms-backend:ci-test

      - name: Build Web Docker Image (dry-run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: daxabithms-web:ci-test

      - name: Build Updater Sidecar Image (dry-run)
        uses: docker/build-push-action@v6
        with:
          context: updater
          file: updater/Dockerfile
          push: false
          tags: daxabithms-updater:ci-test

  windows-build-verification:
    name: Windows Packages & Installer Validation
    runs-on: windows-latest
    needs: [code-quality-and-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Build & Validate Windows Desktop MSIX (Self-Signed Test)
        shell: pwsh
        run: |
          & .\windows\msix\build-windows-msix.ps1 -SelfSignedTest
          & .\windows\msix\validate-msix.ps1 -AllowPlaceholderPublisher

      - name: Build & Validate Windows Server Installer
        shell: pwsh
        run: |
          & .\windows\installer\build-windows-installer.ps1 -SkipServerStaging
          & .\windows\installer\validate-installer.ps1
